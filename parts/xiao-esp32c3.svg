<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Seeed XIAO ESP32-C3 for the TinyGo Playground simulator. -->
<!-- PCB: 20.44×17.78mm. USB-C port centered at top. -->
<!-- Left pads (top→bottom): D0 D1 D2 D3 D4 GND D5 -->
<!-- Right pads (top→bottom): D6 D7 D8 D9 D10 GND 3V3 -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 -1.3 20.44 19.08" width="20.44mm" height="19.08mm">

  <!-- PCB -->
  <rect x="0" y="0" width="20.44" height="17.78" fill="#000000"/>

  <!-- USB port -->
  <rect x="6.22" y="-1.3" width="8" height="6" fill="#ccc"/>

  <!-- pads on the left: D0 D1 D2 D3 D4 GND D5 -->
  <g transform="translate(0, 0)" fill="transparent">
    <g data-pin="D0" transform="translate(0, 0)">
      <path transform="translate(0, 0.47)" d="M 0,0 V 1.6 H 1.61 A 0.8 0.8 0 0 0 1.61 0 Z" fill="#d4af37"/>
      <rect width="3.22" height="2.54" class="area"/>
    </g>
    <g data-pin="D1" transform="translate(0, 2.54)">
      <path transform="translate(0, 0.47)" d="M 0,0 V 1.6 H 1.61 A 0.8 0.8 0 0 0 1.61 0 Z" fill="#d4af37"/>
      <rect width="3.22" height="2.54" class="area"/>
    </g>
    <g data-pin="D2" transform="translate(0, 5.08)">
      <path transform="translate(0, 0.47)" d="M 0,0 V 1.6 H 1.61 A 0.8 0.8 0 0 0 1.61 0 Z" fill="#d4af37"/>
      <rect width="3.22" height="2.54" class="area"/>
    </g>
    <g data-pin="D3" transform="translate(0, 7.62)">
      <path transform="translate(0, 0.47)" d="M 0,0 V 1.6 H 1.61 A 0.8 0.8 0 0 0 1.61 0 Z" fill="#d4af37"/>
      <rect width="3.22" height="2.54" class="area"/>
    </g>
    <g data-pin="D4" transform="translate(0, 10.16)">
      <path transform="translate(0, 0.47)" d="M 0,0 V 1.6 H 1.61 A 0.8 0.8 0 0 0 1.61 0 Z" fill="#d4af37"/>
      <rect width="3.22" height="2.54" class="area"/>
    </g>
    <g data-pin="GND#2" data-title="GND" transform="translate(0, 12.7)">
      <path transform="translate(0, 0.47)" d="M 0,0 V 1.6 H 1.61 A 0.8 0.8 0 0 0 1.61 0 Z" fill="#d4af37"/>
      <rect width="3.22" height="2.54" class="area"/>
    </g>
    <g data-pin="D5" transform="translate(0, 15.24)">
      <path transform="translate(0, 0.47)" d="M 0,0 V 1.6 H 1.61 A 0.8 0.8 0 0 0 1.61 0 Z" fill="#d4af37"/>
      <rect width="3.22" height="2.54" class="area"/>
    </g>
  </g>

  <!-- pads on the right: D6 D7 D8 D9 D10 GND 3V3 -->
  <g transform="translate(17.22, 0)" fill="transparent">
    <g data-pin="D6" transform="translate(0, 0)">
      <path transform="translate(3.22, 0.47)" d="M 0,0 V 1.6 H -1.61 A 0.8 0.8 0 0 1 -1.61 0 Z" fill="#d4af37"/>
      <rect width="3.22" height="2.54" class="area"/>
    </g>
    <g data-pin="D7" transform="translate(0, 2.54)">
      <path transform="translate(3.22, 0.47)" d="M 0,0 V 1.6 H -1.61 A 0.8 0.8 0 0 1 -1.61 0 Z" fill="#d4af37"/>
      <rect width="3.22" height="2.54" class="area"/>
    </g>
    <g data-pin="D8" transform="translate(0, 5.08)">
      <path transform="translate(3.22, 0.47)" d="M 0,0 V 1.6 H -1.61 A 0.8 0.8 0 0 1 -1.61 0 Z" fill="#d4af37"/>
      <rect width="3.22" height="2.54" class="area"/>
    </g>
    <g data-pin="D9" transform="translate(0, 7.62)">
      <path transform="translate(3.22, 0.47)" d="M 0,0 V 1.6 H -1.61 A 0.8 0.8 0 0 1 -1.61 0 Z" fill="#d4af37"/>
      <rect width="3.22" height="2.54" class="area"/>
    </g>
    <g data-pin="D10" transform="translate(0, 10.16)">
      <path transform="translate(3.22, 0.47)" d="M 0,0 V 1.6 H -1.61 A 0.8 0.8 0 0 1 -1.61 0 Z" fill="#d4af37"/>
      <rect width="3.22" height="2.54" class="area"/>
    </g>
    <g data-pin="GND#1" data-title="GND" transform="translate(0, 12.7)">
      <path transform="translate(3.22, 0.47)" d="M 0,0 V 1.6 H -1.61 A 0.8 0.8 0 0 1 -1.61 0 Z" fill="#d4af37"/>
      <rect width="3.22" height="2.54" class="area"/>
    </g>
    <g data-pin="3V3" data-title="3V3" transform="translate(0, 15.24)">
      <path transform="translate(3.22, 0.47)" d="M 0,0 V 1.6 H -1.61 A 0.8 0.8 0 0 1 -1.61 0 Z" fill="#d4af37"/>
      <rect width="3.22" height="2.54" class="area"/>
    </g>
  </g>
</svg>
